<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Job Application</title></head><body><form action="/apply" method="post" enctype="multipart/form-data"><fieldset><legend>Personal Details</legend><label for="name">Name</label><input type="text" id="name" name="name" required><label for="email">Email</label><input type="email" id="email" name="email" required><label for="phone">Phone</label><input type="tel" id="phone" name="phone" required></fieldset><fieldset><legend>Experience</legend><label for="experience">Experience</label><textarea id="experience" name="experience" rows="4" cols="50" required></textarea></fieldset><label for="resume">Resume</label><input type="file" id="resume" name="resume" accept=".pdf" required><p>Employment Type</p><input type="radio" id="fulltime" name="employmentType" value="fulltime"><label for="fulltime">Full-time</label><input type="radio" id="parttime" name="employmentType" value="parttime"><label for="parttime">Part-time</label><input type="checkbox" id="terms" name="terms" value="accepted" required><label for="terms">I accept the terms and conditions</label><button type="submit">Submit Application</button><button type="submit" formnovalidate>Save Draft</button></form></body></html>
