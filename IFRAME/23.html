<style>
.video-wrapper {
  position: relative;
  width: 560px;
  padding-bottom: 315px;
  height: 0;
}
.video-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
@media (max-width: 600px) {
  .video-wrapper {
    width: 100%;
    padding-bottom: 56.25%;
  }
}
</style>
</head>
<body>
<div class="video-wrapper">
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allow="fullscreen; gyroscope" allowfullscreen title="Responsive Video Player"></iframe>
