<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question 30</title>
</head>
<body>

<!-- No special permissions needed, this is a normal webpage -->
<iframe src="https://www.example.com" width="100%" height="300" title="Normal Webpage" style="border:none"></iframe>

<!-- Fullscreen and gyroscope are needed for an interactive video/demo -->
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" width="560" height="315" allow="fullscreen; gyroscope" allowfullscreen title="Interactive Video" style="border:none"></iframe>

<!-- USB is needed because this content connects to a physical device -->
<iframe src="https://device.example.com" width="600" height="400" allow="usb" title="Device Connection" style="border:none"></iframe>

</body>
</html>
