<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question 10 - Complete Feature Table</title>
</head>
<body>
<h1>Question 10: One Table With All Features</h1>

<table border="1">
  <caption>Semester Result Summary</caption>
  <thead>
    <tr>
      <th scope="col" id="subj">Subject</th>
      <th scope="col" id="int">Internal</th>
      <th scope="col" id="ext">External</th>
      <th scope="col" id="tot">Total</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row" id="math" headers="subj">Mathematics</th>
      <td headers="math int">20</td>
      <td headers="math ext">70</td>
      <td headers="math tot">90</td>
    </tr>
    <tr>
      <th scope="row" id="sci" headers="subj">Science</th>
      <td headers="sci int">18</td>
      <td headers="sci ext">65</td>
      <td headers="sci tot">83</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td colspan="3">Overall Total</td>
      <td>173</td>
    </tr>
  </tfoot>
</table>

</body>
</html>
