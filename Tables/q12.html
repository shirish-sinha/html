<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question 12 - Comparison Table</title>
</head>
<body>
<h1>Question 12: Comparison Table Using Colspan and Rowspan</h1>

<table border="1">
  <tr>
    <th colspan="3">Course Comparison</th>
  </tr>
  <tr>
    <td>Category</td>
    <td>Web Development</td>
    <td>Data Analytics</td>
  </tr>
  <tr>
    <td rowspan="2">Duration</td>
    <td>4 months</td>
    <td>5 months</td>
  </tr>
  <tr>
    <td>Online</td>
    <td>Offline</td>
  </tr>
</table>

</body>
</html>
