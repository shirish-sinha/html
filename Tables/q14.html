<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question 14 - Scope and Headers Table</title>
</head>
<body>
<h1>Question 14: Table Using scope and headers Together</h1>

<table border="1">
  <tr>
    <th></th>
    <th id="colSubject" scope="col">Subject</th>
    <th id="colMarks" scope="col">Marks</th>
  </tr>
  <tr>
    <th id="rowStudent1" scope="row">Riya Shah</th>
    <td headers="rowStudent1 colSubject">Mathematics</td>
    <td headers="rowStudent1 colMarks">90</td>
  </tr>
  <tr>
    <th id="rowStudent2" scope="row">Aman Patel</th>
    <td headers="rowStudent2 colSubject">Science</td>
    <td headers="rowStudent2 colMarks">85</td>
  </tr>
</table>

</body>
</html>
