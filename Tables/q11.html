<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question 11 - Timetable Table</title>
</head>
<body>
<h1>Question 11: Timetable Style Table Using Rowspan</h1>

<table border="1">
  <caption>Weekly Class Schedule</caption>
  <tr>
    <th>Day</th>
    <th>Subject</th>
  </tr>
  <tr>
    <td rowspan="3">Monday</td>
    <td>HTML</td>
  </tr>
  <tr>
    <td>CSS</td>
  </tr>
  <tr>
    <td>JavaScript</td>
  </tr>
</table>

</body>
</html>
