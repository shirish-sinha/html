<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question 9 - Department Summary Table</title>
</head>
<body>
<h1>Question 9: Table Combining Multiple Features</h1>

<table border="1">
  <caption>Department Summary</caption>
  <thead>
    <tr>
      <th scope="col">Department</th>
      <th scope="col">Students</th>
      <th scope="col">Faculty</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Computer Science</td>
      <td>120</td>
      <td>10</td>
    </tr>
    <tr>
      <td>Mechanical</td>
      <td>90</td>
      <td>8</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td colspan="2">Total Students</td>
      <td>210</td>
    </tr>
  </tfoot>
</table>

</body>
</html>
