<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question 8 - Id and Headers Table</title>
</head>
<body>
<h1>Question 8: Table Using id and headers Attributes</h1>

<table border="1">
  <tr>
    <th id="subject">Subject</th>
    <th id="marks">Marks</th>
    <th id="result">Result</th>
  </tr>
  <tr>
    <td headers="subject">Mathematics</td>
    <td headers="marks">85</td>
    <td headers="result">Pass</td>
  </tr>
  <tr>
    <td headers="subject">Science</td>
    <td headers="marks">78</td>
    <td headers="result">Pass</td>
  </tr>
</table>

</body>
</html>
