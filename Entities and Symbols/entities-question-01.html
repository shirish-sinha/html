<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Reserved Characters</title></head>
<body>
  <p>Use &lt;h1&gt; to begin a heading element.</p>
  <p>The greater-than sign is written as &gt;.</p>
  <p>Tom &amp; Maya are working together.</p>
  <p>Use &#x3C;h1&#x3E; to begin a heading element.</p>
  <p>The greater-than sign is written as &#x3E;.</p>
  <p>Tom &#x26; Maya are working together.</p>
</body>
</html>
